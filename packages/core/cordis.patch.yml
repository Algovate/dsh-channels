# dsh-channels bundle patch.
#
# One row: the core plugin. Adapters are plain library packages that the core
# loads by name from `adapters` below, so installing a second channel does not
# add a second loader row (and uninstalling one cannot leave a dangling row).
- insert:
    - id: dsh-channels
      name: '@rodin/dsh-channels'
      config:
        # Empty allowlist = deny everyone. Fill in the sender id(s) you answer to.
        allowedSenders: []
        # Adapter packages, in load order. Remove one to disable that channel.
        adapters:
          - '@rodin/dsh-channels-weixin'
        maxTextChars: 600
        bubbleGapMs: 400
        maxTurnWaitMs: 1200000
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === '@rodin/dsh-channels' && e.options.id !== 'dsh-channels' && !e.disabled)"
